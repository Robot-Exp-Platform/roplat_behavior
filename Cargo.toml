[workspace]
members = ["roplat_behavior", "roplat_kinematics", "roplat_control", "roplat_trajectory", "roplat_description", "roplat_frames", "roplat_safety", "roplat_scene", "roplat_grasp", "roplat_perception", "roplat_diagnostics", "roplat_world", "roplat_behavior_ffi"]
resolver = "3"

# Each crate has its own README and declares its own version, so an
# algorithm crate can change without moving the contract crate and the
# drivers with it.
[workspace.package]
edition = "2024"
authors = ["Yixing <yanjizhou312@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/Robot-Exp-Platform/roplat_behavior"
categories = ["science::robotics"]

# roplat_msgs is not on crates.io yet; develop against the sibling core
# checkout. Published crates ignore this section.
[patch.crates-io]
roplat = { path = "../roplat/roplat" }
roplat_msgs = { path = "../roplat/roplat_msgs" }

# parry's queries, hulls and convex decomposition are slow unoptimised
# (V-HACD about 200 times), and roplat_scene's tests measure many pairs of shapes.
# Only the dev profile; release builds are optimised anyway.
[profile.dev.package.parry3d-f64]
opt-level = 2

# roplat_scene measures every pair its configuration checks look at with
# its own GJK lower bound, which is slow unoptimised; the same line is in
# roplat_protocols, where it takes roplat_chomp's Panda test from 18 s to
# 7.5 s. Only the dev profile, as above.
[profile.dev.package.roplat_scene]
opt-level = 2
